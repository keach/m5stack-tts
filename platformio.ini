[platformio]
core_dir = .pio-core

[env:m5stack-basic]
platform = espressif32@7.0.1
board = m5stack-core-esp32
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
extra_scripts =
  pre:scripts/build_info.py
lib_extra_dirs =
  vendor/aquestalk
lib_deps =
  m5stack/M5Stack
  bblanchon/ArduinoJson@^7.4.2
  links2004/WebSockets@^2.6.1
